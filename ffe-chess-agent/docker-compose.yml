services:
  # =========================================================
  # Backend FastAPI (le service "Hello World" de l'étape 1)
  # =========================================================
  backend:
    build: ./backend
    container_name: ffe-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongodb:27017
      MONGO_DB: ${MONGO_DB:-ffe_chess}
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
    volumes:
      # Montage du code pour le hot-reload en développement
      - ./backend/app:/app/app
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthcheck')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================
  # MongoDB : stockage des parties, ouvertures, métadonnées
  # =========================================================
  mongodb:
    image: mongo:7
    container_name: ffe-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db

  # =========================================================
  # Milvus (recherche vectorielle) + ses dépendances
  # Le mode "standalone" nécessite etcd (métadonnées) et
  # MinIO (stockage objet).
  # =========================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ffe-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: ffe-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.5.4
    container_name: ffe-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_WEB_PORT:-9091}:9091"
    depends_on:
      - etcd
      - minio

  # =========================================================
  # Frontend Angular (échiquier interactif)
  # -> Ajouté lors d'une étape ultérieure. Décommentez quand
  #    le projet Angular sera initialisé dans ./frontend.
  # =========================================================
  # frontend:
  #   build: ./frontend
  #   container_name: ffe-frontend
  #   ports:
  #     - "${FRONTEND_PORT:-4200}:80"
  #   depends_on:
  #     - backend

volumes:
  mongo_data:
  etcd_data:
  minio_data:
  milvus_data:
