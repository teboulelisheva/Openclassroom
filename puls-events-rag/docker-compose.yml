version: '3.8'

services:
  puls-events-api:
    build: .
    container_name: puls-events-rag
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - VECTORSTORE_PATH=./vectorstore/faiss_index
    volumes:
      - ./vectorstore:/app/vectorstore
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
