name: CI Pipeline

on:
  push:
    branches: [ main, main_dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projet5/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest projet5/tests
